<svg class="fidelity-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="96 100 844 653" role="img" aria-labelledby="fidelity-title fidelity-description">
  <title id="fidelity-title">Fidelity and definition</title>
  <desc id="fidelity-description">A gradual path increases fidelity alongside problem definition. As you scroll, that path fades and a steep path shows how AI can produce high fidelity with little definition.</desc>

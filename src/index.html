    <!-- Circular Video Player -->
    <div class="video-player-circle">
        <video id="circle-video" playsinline>
            <source src="videos/spiel.mp4" type="video/mp4">
        </video>
        <div class="video-overlay" id="video-overlay">
            <div class="play-button-wrapper" id="play-button">
                <div class="play-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="white">
                        <path d="M6.3 2.84A1.5 1.5 0 0 0 4 4.11v11.78a1.5 1.5 0 0 0 2.3 1.27l9.344-5.891a1.5 1.5 0 0 0 0-2.538z"/>
                    </svg>

            </div>
        </div>
    </div>

    <!-- Playback Speed Button -->
    <button class="playback-speed-button" id="playback-speed-button">1.2×</button>

    <script>
        // Color Themes
        const themes = [
            { name: 'Beige Classic', base: '#fffcf0', accent: '#000000' },
            { name: 'Yellow', base: '#FFD93D', accent: '#1a1a1a' },
            { name: 'Periwinkle', base: '#9BB8E8', accent: '#2d4a7c' },
            { name: 'Charcoal', base: '#5a5a5a', accent: '#e0e0e0' },
            { name: 'Forest', base: '#1e5945', accent: '#a8d5ba' },
            { name: 'Sand', base: '#d9c7a8', accent: '#4a3f35' },
            { name: 'Sage', base: '#b4c4a8', accent: '#3d5a3d' },
            { name: 'Deep Teal', base: '#0f3d30', accent: '#d0e8df' },
            { name: 'Amber', base: '#F5A623', accent: '#5a3d1e' },
            { name: 'Gold Rush', base: '#FFD301', accent: '#FD022C' },
            { name: 'Desert Sand', base: '#918A45', accent: '#FDF5D4' },
            { name: 'Rust Sky', base: '#945C0F', accent: '#9DC7FF' },
            { name: 'Jade', base: '#336C5D', accent: '#E6DBAE' },
            { name: 'Midnight Purple', base: '#282954', accent: '#C6A7E6' },
            { name: 'Mahogany', base: '#482927', accent: '#E3B1AB' },
            { name: 'Slate Coral', base: '#344749', accent: '#FF7560' },
            { name: 'Electric Blue', base: '#578FFF', accent: '#1D1D34' }
        ];

        let currentThemeIndex = 0;

        // Helper function to convert hex to rgba
        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // Update theme preview squares
        function updateThemePreview(currentIndex) {
            const preview1 = document.getElementById('theme-preview-1');
            const preview2 = document.getElementById('theme-preview-2');
            const preview3 = document.getElementById('theme-preview-3');

            const nextIndex1 = (currentIndex + 1) % themes.length;
            const nextIndex2 = (currentIndex + 2) % themes.length;
            const nextIndex3 = (currentIndex + 3) % themes.length;

            preview1.style.backgroundColor = themes[nextIndex1].base;
            preview2.style.backgroundColor = themes[nextIndex2].base;
            preview3.style.backgroundColor = themes[nextIndex3].base;
        }

        // Apply theme
        function applyTheme(index) {
            const theme = themes[index];
            const root = document.documentElement;

            root.style.setProperty('--color-base', theme.base);
            root.style.setProperty('--color-accent', theme.accent);
            root.style.setProperty('--color-accent-50', hexToRgba(theme.accent, 0.5));

            currentThemeIndex = index;
            localStorage.setItem('themeIndex', index);
            updateThemePreview(index);
        }

        // Cycle to next theme
        function nextTheme() {
            const nextIndex = (currentThemeIndex + 1) % themes.length;
            applyTheme(nextIndex);
        }

        // Initialize theme on page load
        function initTheme() {
            const savedIndex = localStorage.getItem('themeIndex');

            if (savedIndex !== null) {
                // Use saved theme when navigating between pages
                applyTheme(parseInt(savedIndex));
            } else {
                // Random theme on first visit / new session
                const randomIndex = Math.floor(Math.random() * themes.length);
                applyTheme(randomIndex);
            }
        }

        // Theme switcher button
        document.getElementById('theme-switcher').addEventListener('click', nextTheme);

        // Initialize theme
        initTheme();

        // Set last updated date
        document.getElementById('last-updated').textContent = new Date().toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });

        // Smooth scroll for navigation links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        });

        // Page transition animations
        window.addEventListener('load', function() {
            const fadeElements = document.querySelectorAll('.fade-in-element');
            fadeElements.forEach(element => {
                element.classList.add('animate');
            });
        });

        // Circular video player
        const videoPlayer = document.getElementById('circle-video');
        const videoOverlay = document.getElementById('video-overlay');
        const playButton = document.getElementById('play-button');
        const videoCircle = document.querySelector('.video-player-circle');
        const speedButton = document.getElementById('playback-speed-button');

        let isDragging = false;
        let hasDragged = false;
        let dragOffset = { x: 0, y: 0 };

        // Playback speed control
        const playbackSpeeds = [1.0, 1.2, 1.5, 1.7, 2.0];
        let currentSpeedIndex = 1;
        videoPlayer.playbackRate = 1.2;

        function updateSpeedButtonPosition() {
            const rect = videoCircle.getBoundingClientRect();
            speedButton.style.left = rect.left + rect.width / 2 + 'px';
            speedButton.style.top = rect.bottom + 20 + 'px';
            speedButton.style.transform = 'translateX(-50%)';
        }

        speedButton.addEventListener('click', function() {
            currentSpeedIndex = (currentSpeedIndex + 1) % playbackSpeeds.length;
            const speed = playbackSpeeds[currentSpeedIndex];
            videoPlayer.playbackRate = speed;
            speedButton.textContent = speed.toFixed(1) + '×';
        });

        // Update button position initially and on resize
        updateSpeedButtonPosition();
        window.addEventListener('resize', updateSpeedButtonPosition);

        playButton.addEventListener('click', function(e) {
            e.stopPropagation();
            videoPlayer.play();
            videoOverlay.classList.add('hidden');
            videoCircle.classList.add('expanded');

            // Update position after expansion animation
            setTimeout(updateSpeedButtonPosition, 400);

            // Show speed button after 1 second delay with fade-in
            speedButton.style.display = 'flex';
            setTimeout(function() {
                speedButton.classList.add('visible');
            }, 1000);
        });

        videoPlayer.addEventListener('click', function(e) {
            if (!videoPlayer.paused && !hasDragged) {
                videoPlayer.pause();
                videoPlayer.currentTime = 0;
                videoOverlay.classList.remove('hidden');
                videoCircle.classList.remove('expanded');
                speedButton.classList.remove('visible');
                speedButton.style.display = 'none';

                // Reset position
                videoCircle.style.left = '50%';
                videoCircle.style.top = '40px';
                videoCircle.style.transform = 'translateX(-50%)';
            }
        });

        // Reset when video ends
        videoPlayer.addEventListener('ended', function() {
            videoPlayer.currentTime = 0;
            videoOverlay.classList.remove('hidden');
            videoCircle.classList.remove('expanded');
            speedButton.classList.remove('visible');
            speedButton.style.display = 'none';

            // Reset position
            videoCircle.style.left = '50%';
            videoCircle.style.top = '40px';
            videoCircle.style.transform = 'translateX(-50%)';
        });

        // Drag functionality
        function startDrag(e) {
            if (!videoCircle.classList.contains('expanded')) return;

            isDragging = true;
            hasDragged = false;
            speedButton.classList.add('hidden');

            const rect = videoCircle.getBoundingClientRect();
            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;

            dragOffset.x = clientX - rect.left - rect.width / 2;
            dragOffset.y = clientY - rect.top;

            e.preventDefault();
        }

        function drag(e) {
            if (!isDragging) return;

            hasDragged = true;
            videoCircle.classList.add('dragging');

            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;

            // Use the scaled size for constraints (desktop: 200px * 1.2, mobile: 188px * 1.2)
            const baseSize = window.innerWidth <= 768 ? 188 : 200;
            const scaledWidth = baseSize * 1.2;
            const scaledHeight = baseSize * 1.2;
            // Use 10px margin on single column layout, 40px on desktop
            const margin = window.innerWidth <= 1024 ? 10 : 40;

            let x = clientX - dragOffset.x;
            let y = clientY - dragOffset.y;

            // Constrain to viewport with margin
            // X is centered with translateX(-50%), so check half-width from center
            x = Math.max(margin + scaledWidth / 2, Math.min(window.innerWidth - margin - scaledWidth / 2, x));
            // Y uses top edge positioning, so check full height
            y = Math.max(margin, Math.min(window.innerHeight - margin - scaledHeight, y));

            videoCircle.style.left = x + 'px';
            videoCircle.style.top = y + 'px';
            videoCircle.style.transform = 'translateX(-50%) scale(1.2)';

            updateSpeedButtonPosition();

            e.preventDefault();
        }

        function endDrag(e) {
            if (!isDragging) return;
            isDragging = false;
            videoCircle.classList.remove('dragging');
            speedButton.classList.remove('hidden');

            // Reset scale to normal playback size
            videoCircle.style.transform = 'translateX(-50%)';

            updateSpeedButtonPosition();

            // Reset hasDragged after a short delay to allow click event to check it
            setTimeout(() => {
                hasDragged = false;
            }, 100);
        }

        videoCircle.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', endDrag);

        videoCircle.addEventListener('touchstart', startDrag);
        document.addEventListener('touchmove', drag, { passive: false });
        document.addEventListener('touchend', endDrag);
    </script>
</body>
</html>

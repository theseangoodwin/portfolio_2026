    <button class="theme-switcher" id="theme-switcher" aria-label="Change color theme">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <script>
        // Disable scroll restoration to prevent layout shift on refresh
        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
        }
        window.scrollTo(0, 0);

        // Color Themes
        const themes = [
            { name: 'Beige Classic', base: '#fffcf0', accent: '#000000' },
            { name: 'Periwinkle', base: '#9BB8E8', accent: '#2d4a7c' },
            { name: 'Charcoal', base: '#5a5a5a', accent: '#e0e0e0' },
            { name: 'Forest', base: '#1e5945', accent: '#a8d5ba' },
            { name: 'Sand', base: '#d9c7a8', accent: '#4a3f35' },
            { name: 'Sage', base: '#b4c4a8', accent: '#3d5a3d' },
            { name: 'Deep Teal', base: '#0f3d30', accent: '#d0e8df' },
            { name: 'Amber', base: '#F5A623', accent: '#5a3d1e' },
            { name: 'Desert Sand', base: '#918A45', accent: '#FDF5D4' },
            { name: 'Rust Sky', base: '#945C0F', accent: '#9DC7FF' },
            { name: 'Jade', base: '#336C5D', accent: '#E6DBAE' },
            { name: 'Midnight Purple', base: '#282954', accent: '#C6A7E6' },
            { name: 'Mahogany', base: '#482927', accent: '#E3B1AB' },
            { name: 'Slate Coral', base: '#344749', accent: '#FF7560' },
            { name: 'Electric Blue', base: '#578FFF', accent: '#1D1D34' },
            { name: 'Coral Gold', base: '#ca4c40', accent: '#ffd301' }
        ];

        let currentThemeIndex = 0;

        // Helper function to convert hex to rgba
        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // Apply theme
        function applyTheme(index) {
            const theme = themes[index];
            const root = document.documentElement;

            root.style.setProperty('--color-base', theme.base);
            root.style.setProperty('--color-accent', theme.accent);
            root.style.setProperty('--color-accent-50', hexToRgba(theme.accent, 0.5));

            currentThemeIndex = index;
            localStorage.setItem('themeName', theme.name);
            const nextTheme = themes[(index + 1) % themes.length];
            root.style.setProperty('--color-next-theme', nextTheme.base);
        }

        // Cycle to next theme
        function nextTheme() {
            const nextIndex = (currentThemeIndex + 1) % themes.length;
            applyTheme(nextIndex);
        }

        // Initialize theme on page load - cycle to next theme on each load
        function initTheme() {
            const savedName = localStorage.getItem('themeName');
            const savedIndex = themes.findIndex(theme => theme.name === savedName);

            if (savedIndex >= 0) {
                // Advance to next theme on each page load
                const nextIndex = (savedIndex + 1) % themes.length;
                applyTheme(nextIndex);
            } else {
                // Random theme on first visit
                const randomIndex = Math.floor(Math.random() * themes.length);
                applyTheme(randomIndex);
            }
        }

        // Theme switcher button
        document.getElementById('theme-switcher').addEventListener('click', nextTheme);

        // Initialize theme
        initTheme();

        // Smooth scroll for navigation links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        });

        // Page transition animations
        window.addEventListener('load', function() {
            const fadeElements = document.querySelectorAll('.fade-in-element');
            fadeElements.forEach(element => {
                element.classList.add('animate');
            });
        });

        // Open external links in new tab
        document.querySelectorAll('a[href^="http"]').forEach(link => {
            if (!link.href.includes(window.location.hostname)) {
                link.setAttribute('target', '_blank');
                link.setAttribute('rel', 'noopener noreferrer');
            }
        });

        // Weather for Washington, DC
        let tempCelsius = null;
        let showFahrenheit = true;
        const weatherEl = document.getElementById('weather-temp');

        async function fetchWeather() {
            try {
                // Washington, DC coordinates
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=38.9072&longitude=-77.0369&current_weather=true');
                const data = await response.json();
                tempCelsius = data.current_weather.temperature;
                updateWeatherDisplay();
            } catch (error) {
                weatherEl.textContent = '--°F';
            }
        }

        function updateWeatherDisplay() {
            if (tempCelsius === null) return;
            if (showFahrenheit) {
                const tempF = Math.round((tempCelsius * 9/5) + 32);
                weatherEl.textContent = tempF + '°F';
            } else {
                weatherEl.textContent = Math.round(tempCelsius) + '°C';
            }
        }

        weatherEl.addEventListener('click', function() {
            showFahrenheit = !showFahrenheit;
            updateWeatherDisplay();
        });

        fetchWeather();

        // Circular video player
        const videoPlayer = document.getElementById('circle-video');
        const videoOverlay = document.getElementById('video-overlay');
        const playButton = document.getElementById('play-button');
        const videoCircle = document.querySelector('.video-player-circle');
        const speedButton = document.getElementById('playback-speed-button');

        let isDragging = false;
        let hasDragged = false;
        let dragOffset = { x: 0, y: 0 };

        // Playback speed control
        const playbackSpeeds = [1.0, 1.2, 1.5, 1.7, 2.0];
        let currentSpeedIndex = 1;
        videoPlayer.playbackRate = 1.2;

        function updateSpeedButtonPosition() {
            const rect = videoCircle.getBoundingClientRect();
            speedButton.style.left = rect.left + rect.width / 2 + 'px';
            const below = rect.bottom + 20;
            const above = rect.top - speedButton.offsetHeight - 20;
            speedButton.style.top = (below + speedButton.offsetHeight <= window.innerHeight ? below : above) + 'px';
            speedButton.style.transform = 'translateX(-50%)';
        }

        speedButton.addEventListener('click', function() {
            currentSpeedIndex = (currentSpeedIndex + 1) % playbackSpeeds.length;
            const speed = playbackSpeeds[currentSpeedIndex];
            videoPlayer.playbackRate = speed;
            speedButton.textContent = speed.toFixed(1) + '×';
        });

        // Update button position initially and on resize
        updateSpeedButtonPosition();
        window.addEventListener('resize', updateSpeedButtonPosition);

        playButton.addEventListener('click', function(e) {
            e.stopPropagation();
            videoPlayer.play();
            videoOverlay.classList.add('hidden');
            videoCircle.classList.add('expanded');

            // Update position after expansion animation
            setTimeout(updateSpeedButtonPosition, 400);

            // Show speed button after 1 second delay with fade-in
            speedButton.style.display = 'flex';
            setTimeout(function() {
                speedButton.classList.add('visible');
            }, 1000);
        });

        videoPlayer.addEventListener('click', function(e) {
            if (!videoPlayer.paused && !hasDragged) {
                videoPlayer.pause();
                videoPlayer.currentTime = 0;
                videoOverlay.classList.remove('hidden');
                videoCircle.classList.remove('expanded');
                speedButton.classList.remove('visible');
                speedButton.style.display = 'none';

                // Reset position
                videoCircle.style.removeProperty('left');
                videoCircle.style.removeProperty('top');
                videoCircle.style.removeProperty('transform');
            }
        });

        // Reset when video ends
        videoPlayer.addEventListener('ended', function() {
            videoPlayer.currentTime = 0;
            videoOverlay.classList.remove('hidden');
            videoCircle.classList.remove('expanded');
            speedButton.classList.remove('visible');
            speedButton.style.display = 'none';

            // Reset position
            videoCircle.style.removeProperty('left');
            videoCircle.style.removeProperty('top');
            videoCircle.style.removeProperty('transform');
        });

        // Drag functionality
        function startDrag(e) {
            if (!videoCircle.classList.contains('expanded')) return;

            isDragging = true;
            hasDragged = false;
            speedButton.classList.add('hidden');

            const rect = videoCircle.getBoundingClientRect();
            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;

            dragOffset.x = clientX - rect.left - rect.width / 2;
            dragOffset.y = clientY - rect.top;

            e.preventDefault();
        }

        function drag(e) {
            if (!isDragging) return;

            hasDragged = true;
            videoCircle.classList.add('dragging');

            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;

            // Use the scaled size for constraints (desktop: 200px * 1.2, mobile: 188px * 1.2)
            const baseSize = window.innerWidth <= 768 ? 188 : 200;
            const scaledWidth = baseSize * 1.2;
            const scaledHeight = baseSize * 1.2;
            // Use 10px margin on single column layout, 40px on desktop
            const margin = window.innerWidth <= 1024 ? 10 : 40;

            let x = clientX - dragOffset.x;
            let y = clientY - dragOffset.y;

            // Constrain to viewport with margin
            // X is centered with translateX(-50%), so check half-width from center
            x = Math.max(margin + scaledWidth / 2, Math.min(window.innerWidth - margin - scaledWidth / 2, x));
            // Y uses top edge positioning, so check full height
            y = Math.max(margin, Math.min(window.innerHeight - margin - scaledHeight, y));

            videoCircle.style.left = x + 'px';
            videoCircle.style.top = y + 'px';
            videoCircle.style.transform = 'translateX(-50%) scale(1.2)';

            updateSpeedButtonPosition();

            e.preventDefault();
        }

        function endDrag(e) {
            if (!isDragging) return;
            isDragging = false;
            videoCircle.classList.remove('dragging');
            speedButton.classList.remove('hidden');

            // Reset scale to normal playback size
            videoCircle.style.transform = 'translateX(-50%)';

            updateSpeedButtonPosition();

            // Reset hasDragged after a short delay to allow click event to check it
            setTimeout(() => {
                hasDragged = false;
            }, 100);
        }

        videoCircle.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', endDrag);

        videoCircle.addEventListener('touchstart', startDrag);
        document.addEventListener('touchmove', drag, { passive: false });
        document.addEventListener('touchend', endDrag);
    </script>

    <!-- Vercel Web Analytics -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };

    <script defer src="/_vercel/insights/script.js"></script>
    <script>
        const siteTitle = document.querySelector('.site-title');
        const siteHeader = document.querySelector('.site-header');
        const aboutHeading = document.querySelector('#about h1');
        const sectionNav = siteHeader.querySelector('.site-nav');
        const sectionLinks = [...sectionNav.querySelectorAll('a[href^="#"]')];
        const sections = sectionLinks.map(link => document.querySelector(link.hash));
        let activeSectionIndex = 0;
        let navigatingToSection = false;
        let navigationTimeout;
        let stopSectionScramble;
        let stopNameScramble;
        const nameLabel = aboutHeading.textContent;
        aboutHeading.setAttribute('aria-label', nameLabel);
        const scrambleCharacters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%&*+-=?';

        function scrambleText(element, label, duration = 500) {
            if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

            const startedAt = performance.now();
            let frame;
            let lastUpdate = -40;

            function tick(now) {
                const elapsed = now - startedAt;
                if (elapsed >= duration) {
                    element.textContent = label;
                    return;
                }

                if (elapsed - lastUpdate >= 40) {
                    const revealed = Math.floor(elapsed / duration * label.length);
                    const suffix = Array.from(label.slice(revealed), character =>
                        character === ' ' ? character : scrambleCharacters[Math.floor(Math.random() * scrambleCharacters.length)]
                    ).join('');
                    element.textContent = label.slice(0, revealed) + suffix;
                    lastUpdate = elapsed;
                }

                frame = requestAnimationFrame(tick);
            }

            frame = requestAnimationFrame(tick);
            return () => {
                cancelAnimationFrame(frame);
                element.textContent = label;
            };
        }

        function updateHeader() {
            const headerBottom = siteHeader.getBoundingClientRect().bottom;
            const headingBottom = aboutHeading.getBoundingClientRect().bottom;
            const headingTop = headingBottom - aboutHeading.offsetHeight;

            const showNavTitle = headingTop < headerBottom - 1;
            if (showNavTitle !== siteTitle.classList.contains('is-visible')) {
                aboutHeading.classList.toggle('is-leaving', showNavTitle);
                siteTitle.classList.toggle('is-visible', showNavTitle);
                stopNameScramble?.();
                stopNameScramble = scrambleText(showNavTitle ? siteTitle : aboutHeading, nameLabel, 350);
            }

            const reachedBottom = Math.ceil(window.scrollY + window.innerHeight) >= document.documentElement.scrollHeight;
            const sectionIndex = reachedBottom && window.scrollY > 0
                ? sections.length - 1
                : Math.max(0, sections.findLastIndex(section => section.getBoundingClientRect().top <= headerBottom + 2));

            if (!navigatingToSection) setActiveSection(sectionIndex);
        }

        function setActiveSection(sectionIndex) {
            if (sectionIndex === activeSectionIndex) return;

            const previousLink = sectionLinks[activeSectionIndex];
            const activeLink = sectionLinks[sectionIndex];
            previousLink.removeAttribute('aria-current');
            activeLink.setAttribute('aria-current', 'location');
            stopSectionScramble?.();
            stopSectionScramble = scrambleText(activeLink, activeLink.getAttribute('aria-label'));
            activeSectionIndex = sectionIndex;
        }

        function finishSectionNavigation() {
            if (!navigatingToSection) return;
            clearTimeout(navigationTimeout);
            navigatingToSection = false;
            updateHeader();
        }

        sectionLinks.forEach((link, index) => {
            link.addEventListener('click', event => {
                if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;

                clearTimeout(navigationTimeout);
                navigatingToSection = true;
                setActiveSection(index);
                navigationTimeout = setTimeout(finishSectionNavigation, 1200);
            });
        });

        document.addEventListener('scrollend', finishSectionNavigation);
        window.addEventListener('scroll', updateHeader, { passive: true });
        window.addEventListener('resize', updateHeader);
        window.addEventListener('pageshow', updateHeader);
        updateHeader();
    </script>
    <script>
        const photoHover = matchMedia('(hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference)');

        document.querySelectorAll('.collage-photo').forEach(photo => {
            const card = photo.closest('figure');
            photo.addEventListener('pointermove', event => {
                if (!photoHover.matches || event.pointerType !== 'mouse') return;

                const bounds = photo.getBoundingClientRect();
                const x = (event.clientX - bounds.left) / bounds.width;
                const y = (event.clientY - bounds.top) / bounds.height;
                card.style.setProperty('--shine-x', x * 100 + '%');
                card.style.setProperty('--shine-y', y * 100 + '%');
                card.style.setProperty('--tilt-x', (0.5 - y) * 6 + 'deg');
                card.style.setProperty('--tilt-y', (x - 0.5) * 6 + 'deg');
                card.classList.add('is-hovered');
            });

            photo.addEventListener('pointerleave', () => card.classList.remove('is-hovered'));
        });
    </script>

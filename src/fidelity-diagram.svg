  </g>
  <g fill="currentColor" font-family="var(--font-berkeley, monospace)" font-size="36" letter-spacing=".02em">
    <text x="569" y="745" text-anchor="middle" dx=".01em">DEFINITION</text>
    <text transform="translate(124 388) rotate(90)" text-anchor="middle" dx=".01em">FIDELITY</text>
  </g>
</svg>

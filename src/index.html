<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sean Goodwin - Product Designer specializing in design systems, AI integration, and user experience.">
    <meta name="author" content="Sean Goodwin">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Sean Goodwin">
    <meta property="og:description" content="Product Designer specializing in design systems, AI integration, and user experience.">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Sean Goodwin">
    <meta name="twitter:description" content="Product Designer specializing in design systems, AI integration, and user experience.">

    <title>Sean Goodwin</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="site-header">
            <h1 class="site-title">Sean Goodwin</h1>
            <nav class="site-nav">
                <a href="index.html">About</a>
                <a href="work.html">Work</a>
                <button class="theme-switcher" id="theme-switcher" aria-label="Change color theme"></button>
            </nav>
        </header>

        <main class="three-column-grid">
            <section id="about" class="column">
                <!-- ABOUT_CONTENT -->
            </section>

            <section id="writing" class="column">
                <!-- WRITING_CONTENT -->
            </section>

            <section id="experience" class="column">
                <!-- EXPERIENCE_CONTENT -->
            </section>
        </main>

        <footer class="site-footer">
            <div class="footer-links">
                <a href="mailto:hello@seangoodwin.com">Email</a>
                <a href="https://linkedin.com/in/seangoodwin" target="_blank" rel="noopener">LinkedIn</a>
                <a href="https://github.com/theseangoodwin" target="_blank" rel="noopener">GitHub</a>
                <a href="https://twitter.com/seangoodwin" target="_blank" rel="noopener">Twitter</a>
            </div>
            <p class="footer-updated">Last updated: <span id="last-updated"></span></p>
        </footer>
    </div>

    <script>
        // Color Themes
        const themes = [
            { name: 'Beige Classic', base: '#fffcf0', accent: '#000000' },
            { name: 'Mint', base: '#e8f5e9', accent: '#1b5e20' },
            { name: 'Lavender', base: '#f3e5f5', accent: '#4a148c' },
            { name: 'Peach', base: '#fff3e0', accent: '#e65100' },
            { name: 'Sky', base: '#e3f2fd', accent: '#01579b' },
            { name: 'Rose', base: '#fce4ec', accent: '#880e4f' },
            { name: 'Sage', base: '#f1f8e9', accent: '#33691e' },
            { name: 'Cream', base: '#fffde7', accent: '#f57f17' },
            { name: 'Ice', base: '#e0f7fa', accent: '#006064' },
            { name: 'Blush', base: '#ffebee', accent: '#b71c1c' }
        ];

        let currentThemeIndex = 0;

        // Helper function to convert hex to rgba
        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // Apply theme
        function applyTheme(index) {
            const theme = themes[index];
            const root = document.documentElement;

            root.style.setProperty('--color-base', theme.base);
            root.style.setProperty('--color-accent', theme.accent);
            root.style.setProperty('--color-accent-20', hexToRgba(theme.accent, 0.2));

            currentThemeIndex = index;
            localStorage.setItem('themeIndex', index);
        }

        // Cycle to next theme
        function nextTheme() {
            const nextIndex = (currentThemeIndex + 1) % themes.length;
            applyTheme(nextIndex);
        }

        // Initialize theme on page load
        function initTheme() {
            const savedIndex = localStorage.getItem('themeIndex');

            if (savedIndex !== null) {
                applyTheme(parseInt(savedIndex));
            } else {
                // Random theme on first visit
                const randomIndex = Math.floor(Math.random() * themes.length);
                applyTheme(randomIndex);
            }
        }

        // Theme switcher button
        document.getElementById('theme-switcher').addEventListener('click', nextTheme);

        // Initialize theme
        initTheme();

        // Set last updated date
        document.getElementById('last-updated').textContent = new Date().toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });

        // Smooth scroll for navigation links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        });
    </script>
</body>
</html>
